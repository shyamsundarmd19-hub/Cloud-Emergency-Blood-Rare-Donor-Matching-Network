name: LifeLine CI/CD EC2 Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Test & Quality Checks
  # ----------------------------------------------------------------------------
  ci-test:
    name: Automated Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Backend Integration & Smoke Tests
        env:
          DATABASE_URL: "sqlite:///./test_ci.db"
          SECRET_KEY: "ci-test-secret-key-for-automated-validation"
          ENVIRONMENT: "development"
        run: |
          python backend/tests/test_api.py

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Compile Frontend Bundle
        run: |
          cd frontend
          npm ci
          npm run build

  # ----------------------------------------------------------------------------
  # Job 2: Remote Continuous Deployment to AWS EC2 via SSH
  # ----------------------------------------------------------------------------
  cd-deploy:
    name: Deploy to AWS EC2 Free Tier (Direct Host)
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Remote AWS EC2 Instance
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script_stop: true
          command_timeout: 15m
          script: |
            echo "=========================================================="
            echo "🚀 [CI/CD] LifeLine Production Deployment Initiated"
            echo "Host: $(hostname) | Date: $(date)"
            echo "=========================================================="
            
            # Navigate to project repository
            cd /home/ubuntu/lifeline
            
            # Make sure deployment script is executable
            chmod +x scripts/deploy.sh
            
            # Run native deployment script
            ./scripts/deploy.sh main
            
            echo "=========================================================="
            echo "✅ [CI/CD] Deployment Succeeded!"
            echo "=========================================================="
